<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Book - SIMPUS-Mini</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>SIMPUS-Mini</h1>
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../books/list.html">Books</a>
      <a href="../books/add.html">Add Book</a>
      <a href="../members/list.html">Members</a>
      <a href="../members/add.html">Add Member</a>
    </nav>
  </header>
  <main>
    <h2>Add Book</h2>
    <form id="form-add" novalidate>
      <div class="field"><label for="title">Title</label><input type="text" id="title" name="title"></div>
      <div class="field"><label for="author">Author</label><input type="text" id="author" name="author"></div>
      <div class="field"><label for="year">Year</label><input type="number" id="year" name="year"></div>
      <div class="field"><label for="stock">Stock</label><input type="number" id="stock" name="stock"></div>
      <div class="field"><label for="isbn">ISBN (optional)</label><input type="text" id="isbn" name="isbn"></div>
      <button type="submit">Save</button>
    </form>
  </main>
  <script src="../assets/js/app.js"></script>

</body>
</html>
